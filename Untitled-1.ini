---

# 21. COPYWRITING STYLE

Use short, confident statements.

Avoid corporate filler such as:

"Revolutionizing the future of decentralized democratic ecosystems."

Instead write:

**Vote privately. Verify publicly.**

**Proof, not promises.**

**One person. One vote.**

**Your identity proves eligibility. Your vote stays private.**

**Don't trust the result. Verify it.**

The copy should sound technically confident without making unsupported security claims.

---

# 22. FINAL QUALITY BAR

Before considering the landing page complete, check:

- Does the hero immediately explain the product?
- Is "Launch Demo" obvious?
- Does the privacy model make sense visually?
- Is the voting flow understandable in under 30 seconds?
- Does the page feel like serious infrastructure?
- Does it avoid generic crypto aesthetics?
- Are animations smooth?
- Is mobile polished?
- Are there no fake statistics?
- Are security claims technically responsible?
- Is the design original rather than a copy of the reference websites?

The final result should feel like a **funded Web3/civic-tech startup with production-quality design**, not a hackathon template.