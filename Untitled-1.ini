# 6. PROBLEM SECTION

Create a large editorial section.

Headline:

# Digital voting has a trust problem.

Supporting text:

Traditional digital voting often forces users to choose between convenience, privacy, and transparency.

Then create four cards:

### Identity

How do we know the voter is eligible?

### Privacy

How do we prevent the vote from being linked back to the voter?

### Integrity

How do we know nobody changed the vote?

### Verification

How can someone independently verify the result?

Cards should animate into view as the user scrolls.

---

# 7. SOLUTION SECTION

Create a major section inspired by Vocdoni's step-by-step product storytelling.

Headline:

# From identity to proof.

Show a large interactive 5-step flow.

### 01
**Verify Eligibility**

Confirm that the person is allowed to participate.

### 02
**Generate Proof**

Create a cryptographic proof of eligibility without exposing unnecessary identity information.

### 03
**Cast Your Vote**

Submit an anonymous ballot.

### 04
**Record & Verify**

The system records the necessary cryptographic information for integrity verification.

### 05
**Verify Results**

Anyone with access to the verification data can independently check the election result.

Make the active step visually highlighted.

Allow the user to click each step.

Animate the central visualization when changing steps.

