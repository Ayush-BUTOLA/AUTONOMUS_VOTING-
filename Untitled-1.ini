Build the **landing page for a privacy-preserving Web3 voting platform** using:

- Next.js
- TypeScript
- Tailwind CSS
- Framer Motion / Motion
- Lucide React
- Modern responsive design

The landing page should feel like a **premium technology/infrastructure company**, combining the visual quality and product storytelling of Agora with the voting, privacy, and verification messaging of Vocdoni.

Reference websites for design inspiration:
- https://vocdoni.io/en/
- https://www.agora.io/en/

Do NOT copy their layouts, text, branding, illustrations, or assets. Take inspiration from their design principles and create an original interface.

---

# 1. CORE PRODUCT

The product is a **privacy-preserving, cryptographically verifiable voting platform**.

The core idea:

> **Prove you're eligible to vote without revealing how you voted.**

The system is designed around:

**Identity Verification → Zero-Knowledge Proof → Anonymous Vote → Verifiable Record → Publicly Verifiable Results**

The landing page must communicate this within the first few seconds.

The product should NOT feel like a cryptocurrency exchange.

It should feel like:

**Civic Infrastructure + Web3 + Cryptography + Premium SaaS**

---

# 2. DESIGN DIRECTION

Use a sophisticated dark/light hybrid aesthetic.

Primary visual characteristics:

- Deep dark background in major sections
- Large bold typography
- White/off-white text
- One distinctive accent color
- Very subtle gradients
- Thin borders
- Glass-like surfaces
- Soft background glow
- Large whitespace
- Rounded cards
- Subtle shadows
- Minimal icons
- Smooth scrolling
- Premium micro-interactions

Avoid:

- Generic crypto aesthetics
- Excessive neon
- Bitcoin/coin imagery
- Random 3D crypto objects
- Overly complicated backgrounds
- Excessive glassmorphism
- Huge amounts of text
- Stock photos of people voting

The page should look like a **serious infrastructure product**.

---

