# 17. ANIMATION SYSTEM

Use Motion/Framer Motion.

Animations should feel like a premium technology website.

Use:

- Fade-in
- Slide-up
- Scale-in
- Staggered cards
- Scroll-triggered animations
- Animated protocol connections
- Number transitions
- Hover states
- Button micro-interactions
- Navbar transition
- Background movement

For the hero:

Have the protocol visualization continuously but subtly animate.

For architecture:

Animate data/proof particles moving from:

Identity → Proof → Vote → Verification.

Do NOT make animations distracting.

Support:

`prefers-reduced-motion`

