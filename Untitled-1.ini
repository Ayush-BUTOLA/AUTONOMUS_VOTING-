# 8. PRIVACY SECTION

Create a visually striking dark section.

Headline:

# Your identity proves eligibility.
# Your vote stays private.

Show a visual separation:

```text
┌──────────────────────┐
│     YOUR IDENTITY    │
│                      │
│     Verified ✓       │
└──────────┬───────────┘
           │
           ↓
     ZERO-KNOWLEDGE
        PROOF
           │
           ↓
┌──────────────────────┐
│    ANONYMOUS VOTE    │
│                      │
│    Candidate: ???    │
└──────────────────────┘
